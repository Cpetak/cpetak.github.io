{{- /* Animated fitness-landscape background, landing page only */ -}}
{{- if .IsHome }}
<script src="{{ "js/fitness-landscape.js" | relURL }}" defer></script>
{{- end }}
{{- /* Highlight the current section in the table of contents */ -}}
{{- if (and .IsPage (.Param "ShowToc")) }}
<script>
(function () {
  var links = document.querySelectorAll("details.toc a[href^='#']");
  if (!links.length || !("IntersectionObserver" in window)) return;
  var byId = {};
  links.forEach(function (a) { byId[decodeURIComponent(a.hash.slice(1))] = a; });
  var headings = Array.prototype.filter.call(
    document.querySelectorAll(".post-content h1, .post-content h2, .post-content h3, .post-content h4, .post-content h5, .post-content h6"),
    function (h) { return h.id in byId; });
  if (!headings.length) return;
  var current = null;
  function setActive(h) {
    if (current === h) return;
    if (current) byId[current.id].classList.remove("active");
    current = h;
    byId[h.id].classList.add("active");
  }
  // The active heading is the last one whose top has passed a line 1/4 down the viewport.
  function update() {
    var line = window.innerHeight * 0.25, best = headings[0];
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top <= line) best = headings[i]; else break;
    }
    setActive(best);
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { update(); ticking = false; });
  }, { passive: true });
  update();
})();
</script>
{{- end }}
